<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마을 소개 | 선흘2리</title>
<meta name="description" content="제주시 조천읍 선흘2리의 위치, 이름의 뜻, 세계자연유산 거문오름과 마을회 연락처.">
<meta property="og:type" content="website">
<meta property="og:title" content="마을 소개 | 선흘2리">
<meta property="og:description" content="제주시 조천읍 선흘2리의 위치, 이름의 뜻, 세계자연유산 거문오름과 마을회 연락처.">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta property="og:image" content="assets/img/og_village.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1C3A2C">
<link rel="stylesheet" href="assets/css/site.css?v=20261116t">
</head>
<body>
<main id="main">
<div class="page-head"><div class="wrap">
  <p class="eyebrow">About</p>
  <h1>선흘2리</h1>
  <p class="lead" id="lead"></p>
</div></div>
<section><div class="wrap two">
  <div class="prose" id="about"></div>
  <div>
    <table class="facts" id="facts"></table>
    <div class="video" id="video" style="margin-top:20px" hidden></div>
    <div class="btn-row"><a class="btn line" href="nature.html">자연·관광지</a><a class="btn line" href="events.html">행사 안내</a></div>
  </div>
</div></section>
<section class="alt" id="hamletBlock" hidden><div class="wrap">
  <div class="sec-head"><div><p class="eyebrow">Hamlets</p><h2>네 개의 자연마을</h2></div></div>
  <div class="grid" id="hamlets"></div>
</div></section>
<section id="histBlock" hidden><div class="wrap">
  <p class="eyebrow">History</p><h2>마을이 걸어온 길</h2>
  <p class="lead" id="histLead"></p>
  <div class="hist" id="hist" style="margin-top:18px"></div>
</div></section>
<section class="alt"><div class="wrap">
  <p class="eyebrow">Contact</p><h2>마을회</h2>
  <table class="facts" id="contact" style="margin-top:18px;max-width:640px"></table>
  <div class="btn-row"><a class="btn" href="visit.html">오시는 길</a></div>
</div></section>
</main>
<script src="assets/js/config.js?v=20261116t"></script>
<script src="assets/js/common.js?v=20261116t"></script>
<script src="assets/js/yt-nocaptions.js?v=20261116t" defer></script>
<script>
SH2.init(function (site) {
  var E = SH2.esc;
  SH2.el("lead").textContent = site.intro || "";
  SH2.el("about").innerHTML = (site.about || []).map(function (a) {
    var src = (a.src || []).map(function (s) { return '<a href="' + E(SH2.safeUrl(s.url)) + '" target="_blank" rel="noopener">' + E(s.label) + '</a>'; }).join(", ");
    return "<h2>" + E(a.h) + "</h2><p>" + E(a.p) + "</p>" + (src ? '<p class="src">자료: ' + src + "</p>" : "");
  }).join("");
  SH2.el("facts").innerHTML = (site.facts || []).map(function (r) { return "<tr><th>" + E(r[0]) + "</th><td>" + E(r[1]) + "</td></tr>"; }).join("");
  var c = site.contact || {}, rows = [["마을회", c.org], ["찾아오는 곳", c.place], ["주소", c.address], ["전화", c.tel], ["팩스", c.fax]];
  SH2.el("contact").innerHTML = rows.filter(function (r) { return r[1]; }).map(function (r) {
    return "<tr><th>" + r[0] + "</th><td>" + (r[0] === "전화" ? '<a href="tel:' + E(r[1]) + '">' + E(r[1]) + "</a>" : E(r[1])) + "</td></tr>";
  }).join("");
  if ((site.hamlets || []).length) {
    SH2.el("hamletBlock").hidden = false;
    SH2.el("hamlets").innerHTML = site.hamlets.map(function (h, i) {
      return '<div class="card work-card"><span class="num">' + String(i + 1).padStart(2, "0") + "</span><h3>" + E(h.name) + '</h3><p class="meta" style="display:block">' + E(h.desc) + "</p></div>";
    }).join("");
  }
  if ((site.history || []).length) {
    SH2.el("histBlock").hidden = false;
    SH2.el("histLead").textContent = site.historyNote || "";
    SH2.el("hist").innerHTML = '<ul>' + site.history.map(function (h) { return '<li><span class="when">' + E(h.y) + "</span><span>" + E(h.t) + "</span></li>"; }).join("") + "</ul>";
  }
  var ap = site.aboutPhoto;
  if (ap && SH2.safeUrl(ap.src)) SH2.el("about").insertAdjacentHTML("afterbegin", '<figure class="place-pic" style="margin-bottom:22px"><img src="' + E(SH2.safeUrl(ap.src)) + '" alt="' + E(ap.alt || "") + '">' + (ap.credit ? "<figcaption>사진: " + E(ap.credit) + "</figcaption>" : "") + "</figure>");
  var v = (site.videos || [])[0];
  if (v) { var b = SH2.el("video"); b.hidden = false; b.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.id) + '?cc_load_policy=0&enablejsapi=1" title="' + E(v.title) + '" allowfullscreen loading="lazy"></iframe>'; }
});
</script>
</body>
</html>
